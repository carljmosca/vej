# ==============================================================================
# vej configuration file
# High-performance local System-1 AI decision engine competing with Jev
# ==============================================================================

# Default active model to load when running `vej serve` or `vej decide`
# Supported presets:
#   - "llama-3.2-1b"  (Meta, USA) - Fastest latency (~6-12ms, 0.75 GB)
#   - "smollm2-1.7b"  (Hugging Face, USA/France) - Top reasoning balance (1.05 GB)
#   - "gemma-2-2b"    (Google, USA) - Highest decision accuracy (1.63 GB)
# Or provide a direct path to any custom GGUF file.
default_model = "gemma-4-e2b"

# Daemon network binding
host = "127.0.0.1"
port = 8080

# Hardware & Engine Tuning
threads = 10         # Auto-detected CPU parallelism
n_gpu_layers = 99    # Offload all layers to Apple Silicon Metal / NVIDIA CUDA
n_ctx = 2048         # Context window buffer

# Optional custom model path overrides
[models.llama-3.2-1b]
# path = "/path/to/custom/Llama-3.2-1B-Instruct-Q4_K_M.gguf"
# template = "Llama3"

[models.smollm2-1.7b]
# path = "/path/to/custom/SmolLM2-1.7B-Instruct-Q4_K_M.gguf"
# template = "ChatML"

[models.gemma-2-2b]
# path = "/path/to/custom/gemma-2-2b-it-Q4_K_M.gguf"
# template = "Gemma"
