name: Build & Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (ARM64)
          - name: macOS ARM64 (Apple Silicon)
            target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: vej-macos-arm64
            archive_format: tar.gz
            binary_name: vej

          # macOS Intel (x86_64)
          - name: macOS x86_64 (Intel)
            target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: vej-macos-x86_64
            archive_format: tar.gz
            binary_name: vej

          # Linux AMD64 (x86_64)
          - name: Linux x86_64 (AMD64)
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: vej-linux-x86_64
            archive_format: tar.gz
            binary_name: vej

          # Linux ARM64 (aarch64)
          - name: Linux ARM64 (aarch64)
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact_name: vej-linux-arm64
            archive_format: tar.gz
            binary_name: vej

          # Windows AMD64 (x86_64)
          - name: Windows x86_64 (AMD64)
            target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: vej-windows-x86_64
            archive_format: zip
            binary_name: vej.exe

          # Windows ARM64 (aarch64)
          - name: Windows ARM64 (aarch64)
            target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact_name: vej-windows-arm64
            archive_format: zip
            binary_name: vej.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Setup MSVC environment for Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Setup Clang for Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: egor-tensin/setup-clang@v2
        with:
          version: latest
          platform: x64

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary (release)
        if: matrix.target != 'aarch64-pc-windows-msvc'
        env:
          GGML_NATIVE: "OFF"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary (Windows ARM64 with clang-cl & Ninja)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        env:
          GGML_NATIVE: "OFF"
          GGML_OPENMP: "OFF"
          CMAKE_GENERATOR: "Ninja"
          CC: "clang-cl"
          CXX: "clang-cl"
          CFLAGS: "-Wno-error --target=aarch64-pc-windows-msvc"
          CXXFLAGS: "/EHsc -Wno-error --target=aarch64-pc-windows-msvc"
          CMAKE_SYSTEM_NAME: "Windows"
          CMAKE_SYSTEM_PROCESSOR: "ARM64"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.archive_format == 'tar.gz'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} staging/
          cp README.md staging/
          if [ -d "playground" ]; then
            cp -r playground staging/
            rm -rf staging/playground/node_modules staging/playground/dist
          fi
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C staging .

      - name: Package archive (Windows)
        if: matrix.archive_format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination staging/
          Copy-Item "README.md" -Destination staging/
          if (Test-Path "playground") {
            Copy-Item -Recurse "playground" -Destination staging/
            if (Test-Path "staging/playground/node_modules") {
              Remove-Item -Recurse -Force "staging/playground/node_modules"
            }
            if (Test-Path "staging/playground/dist") {
              Remove-Item -Recurse -Force "staging/playground/dist"
            }
          }
          Compress-Archive -Path "staging/*" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_format }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vej-*
          merge-multiple: true
          path: release-artifacts

      - name: Generate SHA256 checksums
        working-directory: release-artifacts
        run: |
          sha256sum vej-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
