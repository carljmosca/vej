[package]
name = "vej"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Mosca IT LLC"]
description = "High-performance, local System-1 AI decision engine compatible with TypeSafe AI Jev"
repository = "https://github.com/moscait/vej"

[dependencies]
llama-cpp-2 = { version = "0.1.151", default-features = false, features = ["common"] }
tokio = { version = "1.53", features = ["full"] }
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["stream"] }
indicatif = "0.18"
dirs = "6.0"
tower-http = { version = "0.6", features = ["cors", "fs"] }
